name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      FRAUD_DATABASE_URL: postgresql+asyncpg://fraud:fraud@localhost:5432/fraud
      FRAUD_REDIS_URL: redis://localhost:6379/0
      FRAUD_JWT_SECRET: ci-secret
      FRAUD_DEMO_API_KEY: tf_demo_key_change_me
      FRAUD_BOOTSTRAP_ADMIN: "false"
      FRAUD_ENVIRONMENT: development
      FRAUD_FRONTEND_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Train models
        run: python scripts/train_models.py
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8742
